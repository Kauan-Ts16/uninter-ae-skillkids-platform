<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- ==================== CONFIGURAÇÕES ==================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha conta | SkillKids</title>

    <!-- ==================== ESTILOS ==================== -->
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/panel.css">
    <link rel="stylesheet" href="../assets/css/account.css">
</head>

<body class="panel-page">
    <!-- ==================== MENU LATERAL ==================== -->
    <aside id="panel-sidebar" class="panel-sidebar"></aside>

    <div class="panel-body">
        <!-- ==================== CABEÇALHO ==================== -->
        <header id="panel-header" class="panel-header"></header>

        <!-- ==================== CONTEÚDO PRINCIPAL ==================== -->
        <main class="panel-main">
            <section class="panel-intro" aria-labelledby="page-title">
                <h1 id="page-title">Minha conta</h1>

                <p>
                    Gerencie seus dados pessoais e sua senha.
                </p>
            </section>

            <!-- ==================== CARREGAMENTO ==================== -->
            <p id="account-feedback" class="account-feedback" role="status">
                Carregando dados da conta...
            </p>

            <!-- ==================== CONTA ==================== -->
            <div id="account-content" class="account-grid" hidden>
                <!-- ==================== DADOS PESSOAIS ==================== -->
                <section class="panel-card account-card" aria-labelledby="account-data-title">
                    <header class="account-card-header">
                        <h2 id="account-data-title">Dados pessoais</h2>

                        <p>
                            Atualize seu nome e endereço de e-mail.
                        </p>
                    </header>

                    <form id="account-form" class="account-form">
                        <div class="form-group">
                            <label class="form-label" for="account-name">
                                Nome
                            </label>

                            <input id="account-name" class="form-input" name="name" type="text"
                                placeholder="Digite seu nome" autocomplete="name" minlength="3" maxlength="100" required
                                disabled>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="account-email">
                                E-mail
                            </label>

                            <input id="account-email" class="form-input" name="email" type="email"
                                placeholder="Digite seu e-mail" autocomplete="username" minlength="6" maxlength="254"
                                required disabled>
                        </div>

                        <div class="form-group">
                            <span class="form-label">Perfil</span>

                            <p id="account-role" class="account-role"></p>

                            <small class="account-help">
                                O perfil não pode ser alterado nesta tela.
                            </small>
                        </div>

                        <footer class="account-form-footer">
                            <button id="account-submit" class="button button-primary" type="submit" disabled>
                                Salvar alterações
                            </button>
                        </footer>
                    </form>
                </section>

                <!-- ==================== ALTERAÇÃO DE SENHA ==================== -->
                <section class="panel-card account-card" aria-labelledby="account-password-title">
                    <header class="account-card-header">
                        <h2 id="account-password-title">Alterar senha</h2>

                        <p>
                            Defina uma nova senha para sua conta.
                        </p>
                    </header>

                    <form id="account-password-form" class="account-form">
                        <div class="form-group">
                            <label class="form-label" for="account-password">
                                Nova senha
                            </label>

                            <input id="account-password" class="form-input" name="password" type="password"
                                placeholder="De 6 a 50 caracteres" autocomplete="new-password" minlength="6"
                                maxlength="50" required disabled>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="account-password-confirmation">
                                Confirmar nova senha
                            </label>

                            <input id="account-password-confirmation" class="form-input" type="password"
                                placeholder="Digite a senha novamente" autocomplete="new-password" minlength="6"
                                maxlength="50" required disabled>
                        </div>

                        <small class="account-help">
                            Utilize uma senha com pelo menos 6 caracteres.
                        </small>

                        <footer class="account-form-footer">
                            <button id="account-password-submit" class="button button-primary" type="submit" disabled>
                                Alterar senha
                            </button>
                        </footer>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <!-- ==================== NOTIFICAÇÕES ==================== -->
    <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- ==================== SCRIPTS ==================== -->
    <script type="module" src="../assets/js/pages/admin/account.js"></script>
</body>

</html>
